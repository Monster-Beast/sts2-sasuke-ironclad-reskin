name: Validate card titles
on: [push, pull_request]
jobs:
  card-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_card_name_overrides.py
      - run: python tools/test_card_title_pipeline.py
      - run: python -m compileall -q tools
