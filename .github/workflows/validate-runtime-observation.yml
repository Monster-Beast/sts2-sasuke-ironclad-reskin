name: Validate runtime observation
on: [push, pull_request]

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact-build observation manifest
        run: python tools/test_runtime_observation_contract.py
      - name: Validate reviewed exact-build canary contract
        run: python tools/test_runtime_canary_contract.py
      - name: Validate combined canary journal analyzer
        run: python tools/test_runtime_canary_journal.py
      - name: Validate one-shot failure recovery analyzer
        run: python tools/test_runtime_canary_failure.py
      - name: Validate redacted evidence analysis
        run: python tools/test_runtime_observation_analysis.py
      - name: Restore observation behavior matrix
        run: dotnet restore tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj
      - name: Build observation behavior matrix
        run: dotnet build tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj --configuration Release --no-restore
      - name: Execute observation behavior matrix
        run: |
          set -o pipefail
          dotnet run --project tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj \
            --configuration Release --no-build 2>&1 | tee runtime-observation-test.log
          grep -q "RUNTIME_OBSERVATION_GATE_OK" runtime-observation-test.log
          grep -q "INTEGRATION_GATE_OK" runtime-observation-test.log
      - name: Restore full runtime contract
        run: dotnet restore tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj
      - name: Build full runtime contract with observer and canary
        run: dotnet build tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj --configuration Release --no-restore
      - name: Upload observation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-observation-test-log
          path: runtime-observation-test.log
          if-no-files-found: warn

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise observation and canary controls with Windows PowerShell 5.1
        shell: powershell
        run: |
          $observationPath = Resolve-Path "tools/runtime-observation.ps1"
          $canaryPath = Resolve-Path "tools/runtime-canary.ps1"
          $checkpointPath = Resolve-Path "tools/runtime-canary-checkpoint.ps1"
          foreach ($path in @($observationPath, $canaryPath, $checkpointPath)) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$path must remain ASCII-only."
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

          $root = Join-Path $env:RUNNER_TEMP "sasuke-runtime-controls"
          $game = Join-Path $root "game"
          $mod = Join-Path $game "mods\SasukeIronclad"
          New-Item -ItemType Directory -Force -Path $mod | Out-Null

          powershell -NoProfile -ExecutionPolicy Bypass -File $observationPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -SessionLabel "ci-run-1" `
            -MaxEvents 500

          $observationMarkerPath = Join-Path $mod "SasukeIronclad.observe.json"
          if (-not (Test-Path -LiteralPath $observationMarkerPath -PathType Leaf)) {
            throw "observation marker was not created"
          }
          $observationMarker = Get-Content -LiteralPath $observationMarkerPath -Raw | ConvertFrom-Json
          if ($observationMarker.enabled -ne $true -or $observationMarker.mode -ne "read_only") {
            throw "observation marker is not explicit read_only opt-in"
          }
          if ($observationMarker.expected_branch -ne "public-beta" -or $observationMarker.expected_build_id -ne "24251656") {
            throw "observation marker does not acknowledge the exact Beta build"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $observationPath `
            -Action disable `
            -GamePath $game `
            -ModDirectory $mod
          if (Test-Path -LiteralPath $observationMarkerPath) {
            throw "observation marker was not removed"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -TitlesOnly `
            -SessionLabel "ci-titles" `
            -AnchorScale 1.25 `
            -AnchorOffsetX 12 `
            -AnchorOffsetY -8

          $canaryMarkerPath = Join-Path $mod "SasukeIronclad.canary.json"
          if (-not (Test-Path -LiteralPath $canaryMarkerPath -PathType Leaf)) {
            throw "canary marker was not created"
          }
          $canaryMarker = Get-Content -LiteralPath $canaryMarkerPath -Raw | ConvertFrom-Json
          if ($canaryMarker.enabled -ne $true -or $canaryMarker.mode -ne "local_visual_only") {
            throw "canary marker is not explicit local_visual_only opt-in"
          }
          if ($canaryMarker.enable_animations -ne $false -or $canaryMarker.enable_titles -ne $true) {
            throw "canary layer selection is incorrect"
          }
          if ($canaryMarker.session_label -ne "ci-titles") {
            throw "canary session label was not written"
          }
          if ($canaryMarker.expected_branch -ne "public-beta" -or $canaryMarker.expected_build_id -ne "24251656") {
            throw "canary marker does not acknowledge the exact Beta build"
          }
          if ($canaryMarker.anchor_to_local_player -ne $true -or
              [double]$canaryMarker.anchor_scale -ne 1.25 -or
              [double]$canaryMarker.anchor_offset_x -ne 12 -or
              [double]$canaryMarker.anchor_offset_y -ne -8 -or
              $canaryMarker.hide_original_visual -ne $false -or
              -not [string]::IsNullOrEmpty([string]$canaryMarker.replacement_acknowledgement) -or
              $canaryMarker.failure_injection_scenario -ne "none") {
            throw "overlay canary controls are incorrect"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -AnimationsOnly `
            -SessionLabel "ci-animation" `
            -ReplaceOriginal

          $replacementMarker = Get-Content -LiteralPath $canaryMarkerPath -Raw | ConvertFrom-Json
          if ($replacementMarker.enable_animations -ne $true -or
              $replacementMarker.enable_titles -ne $false -or
              $replacementMarker.hide_original_visual -ne $true -or
              $replacementMarker.replacement_acknowledgement -ne "public-beta-24251656-local-ironclad-replacement" -or
              [double]$replacementMarker.anchor_scale -ne 1.2 -or
              [double]$replacementMarker.anchor_offset_x -ne 0 -or
              [double]$replacementMarker.anchor_offset_y -ne -150) {
            throw "replacement canary acknowledgement or approved calibration is incorrect"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -Combined `
            -SessionLabel "ci-combined" `
            -ReplaceOriginal

          $combinedMarker = Get-Content -LiteralPath $canaryMarkerPath -Raw | ConvertFrom-Json
          if ($combinedMarker.enable_animations -ne $true -or
              $combinedMarker.enable_titles -ne $true -or
              $combinedMarker.session_label -ne "ci-combined" -or
              $combinedMarker.hide_original_visual -ne $true) {
            throw "combined canary marker is incorrect"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -AnimationsOnly `
            -SessionLabel "ci-failure" `
            -ReplaceOriginal `
            -FailureScenario missing_timeline `
            -FailureCardId Strike

          $failureMarker = Get-Content -LiteralPath $canaryMarkerPath -Raw | ConvertFrom-Json
          if ($failureMarker.enable_animations -ne $true -or
              $failureMarker.enable_titles -ne $false -or
              $failureMarker.hide_original_visual -ne $true -or
              $failureMarker.failure_injection_scenario -ne "missing_timeline" -or
              $failureMarker.failure_injection_card_id -ne "Strike" -or
              $failureMarker.failure_injection_once -ne $true -or
              $failureMarker.failure_injection_acknowledgement -ne "public-beta-24251656-local-visual-failure-injection") {
            throw "failure canary acknowledgement or one-shot marker is incorrect"
          }

          $eventDirectory = Join-Path $mod "canary-output"
          New-Item -ItemType Directory -Force -Path $eventDirectory | Out-Null
          $eventFile = "runtime-canary-ci-failure.jsonl"
          '{"schema_version":1,"session_id":"ci-failure","sequence":1,"combat_index":0,"event_type":"session_start"}' |
            Set-Content -LiteralPath (Join-Path $eventDirectory $eventFile) -Encoding UTF8
          @{
            schema_version = 1
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString("O")
            enabled = $true
            animations_enabled = $true
            titles_enabled = $false
            session_id = "ci-failure"
            event_file = $eventFile
            failure_injection_scenario = "missing_timeline"
            failure_injection_card_id = "Strike"
            patched_binding_ids = @("card_visual_request")
            reasons = @("fixture")
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $mod "runtime-canary-status.json") -Encoding UTF8
          @{
            schema_version = 1
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString("O")
            attempted = $false
            bound = $false
            overlay_visible = $false
            strategy = "fixture"
            candidate_count = 0
            local_player_reference_count = 0
            reasons = @("fixture")
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $mod "runtime-canary-anchor-status.json") -Encoding UTF8
          @{
            schema_version = 1
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString("O")
            requested = $true
            active = $false
            ever_hidden = $false
            restore_count = 0
            last_transition = "fixture"
            reasons = @("fixture")
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $mod "runtime-canary-replacement-status.json") -Encoding UTF8
          @{
            schema_version = 1
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString("O")
            requested = $true
            scenario = "missing_timeline"
            target_card_id = "Strike"
            armed = $false
            triggered = $true
            trigger_count = 1
            trigger_stage = "can_play"
            original_visual_hidden_at_trigger = $false
            recovery_confirmed = $true
            replacement_active_after_fault = $false
            replacement_ever_hidden = $false
            restore_count_after_fault = 0
            anchor_bound_after_fault = $false
            overlay_visible_after_fault = $false
            replacement_disabled_for_combat = $true
            last_transition = "failure_recovery_confirmed:fixture"
            reasons = @("fixture")
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $mod "runtime-canary-failure-status.json") -Encoding UTF8

          $checkpointRoot = Join-Path $root "checkpoints"
          powershell -NoProfile -ExecutionPolicy Bypass -File $checkpointPath `
            -GamePath $game `
            -ModDirectory $mod `
            -Name "ci-checkpoint" `
            -OutputDirectory $checkpointRoot
          $checkpointDirectory = Join-Path $checkpointRoot "ci-checkpoint"
          foreach ($required in @(
            "checkpoint.json",
            "process.json",
            "status.txt",
            "runtime-canary-failure-status.json",
            $eventFile
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $checkpointDirectory $required) -PathType Leaf)) {
              throw "checkpoint capture is missing $required"
            }
          }
          $checkpoint = Get-Content -LiteralPath (Join-Path $checkpointDirectory "checkpoint.json") -Raw | ConvertFrom-Json
          if ($checkpoint.process_count -ne 0 -or $checkpoint.event_file -ne $eventFile) {
            throw "checkpoint metadata is not deterministic"
          }
          $processDocument = Get-Content -LiteralPath (Join-Path $checkpointDirectory "process.json") -Raw | ConvertFrom-Json
          if (@($processDocument).Count -ne 0) {
            throw "empty process snapshot was not recorded as an empty array"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action status `
            -GamePath $game `
            -ModDirectory $mod
          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action disable `
            -GamePath $game `
            -ModDirectory $mod
          if (Test-Path -LiteralPath $canaryMarkerPath) {
            throw "canary marker was not removed"
          }

          Write-Output "RUNTIME_CONTROLS_POWERSHELL_OK observation=true canary=true combined=true failure=true journal=true checkpoint=true anchor=true replacement=true status=true disable=true"
