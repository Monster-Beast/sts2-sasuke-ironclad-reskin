name: Validate runtime observation
on: [push, pull_request]

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact-build observation manifest
        run: python tools/test_runtime_observation_contract.py
      - name: Validate reviewed exact-build canary contract
        run: python tools/test_runtime_canary_contract.py
      - name: Validate redacted evidence analysis
        run: python tools/test_runtime_observation_analysis.py
      - name: Restore observation behavior matrix
        run: dotnet restore tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj
      - name: Build observation behavior matrix
        run: dotnet build tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj --configuration Release --no-restore
      - name: Execute observation behavior matrix
        run: |
          set -o pipefail
          dotnet run --project tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj \
            --configuration Release --no-build 2>&1 | tee runtime-observation-test.log
          grep -q "RUNTIME_OBSERVATION_GATE_OK" runtime-observation-test.log
          grep -q "INTEGRATION_GATE_OK" runtime-observation-test.log
      - name: Restore full runtime contract
        run: dotnet restore tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj
      - name: Build full runtime contract with observer and canary
        run: dotnet build tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj --configuration Release --no-restore
      - name: Upload observation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-observation-test-log
          path: runtime-observation-test.log
          if-no-files-found: warn

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise observation and canary controls with Windows PowerShell 5.1
        shell: powershell
        run: |
          $observationPath = Resolve-Path "tools/runtime-observation.ps1"
          $canaryPath = Resolve-Path "tools/runtime-canary.ps1"
          foreach ($path in @($observationPath, $canaryPath)) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$path must remain ASCII-only."
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

          $root = Join-Path $env:RUNNER_TEMP "sasuke-runtime-controls"
          $game = Join-Path $root "game"
          $mod = Join-Path $game "mods\SasukeIronclad"
          New-Item -ItemType Directory -Force -Path $mod | Out-Null

          powershell -NoProfile -ExecutionPolicy Bypass -File $observationPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -SessionLabel "ci-run-1" `
            -MaxEvents 500

          $observationMarkerPath = Join-Path $mod "SasukeIronclad.observe.json"
          if (-not (Test-Path -LiteralPath $observationMarkerPath -PathType Leaf)) {
            throw "observation marker was not created"
          }
          $observationMarker = Get-Content -LiteralPath $observationMarkerPath -Raw | ConvertFrom-Json
          if ($observationMarker.enabled -ne $true -or $observationMarker.mode -ne "read_only") {
            throw "observation marker is not explicit read_only opt-in"
          }
          if ($observationMarker.expected_branch -ne "public-beta" -or $observationMarker.expected_build_id -ne "24251656") {
            throw "observation marker does not acknowledge the exact Beta build"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $observationPath `
            -Action disable `
            -GamePath $game `
            -ModDirectory $mod
          if (Test-Path -LiteralPath $observationMarkerPath) {
            throw "observation marker was not removed"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -TitlesOnly `
            -AnchorScale 1.25 `
            -AnchorOffsetX 12 `
            -AnchorOffsetY -8

          $canaryMarkerPath = Join-Path $mod "SasukeIronclad.canary.json"
          if (-not (Test-Path -LiteralPath $canaryMarkerPath -PathType Leaf)) {
            throw "canary marker was not created"
          }
          $canaryMarker = Get-Content -LiteralPath $canaryMarkerPath -Raw | ConvertFrom-Json
          if ($canaryMarker.enabled -ne $true -or $canaryMarker.mode -ne "local_visual_only") {
            throw "canary marker is not explicit local_visual_only opt-in"
          }
          if ($canaryMarker.enable_animations -ne $false -or $canaryMarker.enable_titles -ne $true) {
            throw "canary layer selection is incorrect"
          }
          if ($canaryMarker.expected_branch -ne "public-beta" -or $canaryMarker.expected_build_id -ne "24251656") {
            throw "canary marker does not acknowledge the exact Beta build"
          }
          if ($canaryMarker.anchor_to_local_player -ne $true -or
              [double]$canaryMarker.anchor_scale -ne 1.25 -or
              [double]$canaryMarker.anchor_offset_x -ne 12 -or
              [double]$canaryMarker.anchor_offset_y -ne -8) {
            throw "canary local-player anchor controls are incorrect"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action status `
            -GamePath $game `
            -ModDirectory $mod
          powershell -NoProfile -ExecutionPolicy Bypass -File $canaryPath `
            -Action disable `
            -GamePath $game `
            -ModDirectory $mod
          if (Test-Path -LiteralPath $canaryMarkerPath) {
            throw "canary marker was not removed"
          }

          Write-Output "RUNTIME_CONTROLS_POWERSHELL_OK observation=true canary=true anchor=true status=true disable=true"