name: Validate runtime observation
on: [push, pull_request]

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact-build observation manifest
        run: python tools/test_runtime_observation_contract.py
      - name: Validate redacted evidence analysis
        run: python tools/test_runtime_observation_analysis.py
      - name: Restore observation behavior matrix
        run: dotnet restore tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj
      - name: Build observation behavior matrix
        run: dotnet build tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj --configuration Release --no-restore
      - name: Execute observation behavior matrix
        run: |
          set -o pipefail
          dotnet run --project tools/integration_gate_test/SasukeIronclad.IntegrationGateTest.csproj \
            --configuration Release --no-build 2>&1 | tee runtime-observation-test.log
          grep -q "RUNTIME_OBSERVATION_GATE_OK" runtime-observation-test.log
          grep -q "INTEGRATION_GATE_OK" runtime-observation-test.log
      - name: Restore full runtime contract
        run: dotnet restore tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj
      - name: Build full runtime contract with Harmony observer
        run: dotnet build tools/runtime_contract/SasukeIronclad.RuntimeContract.csproj --configuration Release --no-restore
      - name: Upload observation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-observation-test-log
          path: runtime-observation-test.log
          if-no-files-found: warn

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise observation control with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Resolve-Path "tools/runtime-observation.ps1"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw "tools/runtime-observation.ps1 must remain ASCII-only."
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $root = Join-Path $env:RUNNER_TEMP "sasuke-observation-control"
          $game = Join-Path $root "game"
          $mod = Join-Path $game "mods\SasukeIronclad"
          New-Item -ItemType Directory -Force -Path $mod | Out-Null

          powershell -NoProfile -ExecutionPolicy Bypass -File $path `
            -Action enable `
            -GamePath $game `
            -ModDirectory $mod `
            -SessionLabel "ci-run-1" `
            -MaxEvents 500

          $markerPath = Join-Path $mod "SasukeIronclad.observe.json"
          if (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) {
            throw "observation marker was not created"
          }
          $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
          if ($marker.enabled -ne $true -or $marker.mode -ne "read_only") {
            throw "observation marker is not explicit read_only opt-in"
          }
          if ($marker.expected_branch -ne "public-beta" -or $marker.expected_build_id -ne "24251656") {
            throw "observation marker does not acknowledge the exact Beta build"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File $path `
            -Action status `
            -GamePath $game `
            -ModDirectory $mod
          powershell -NoProfile -ExecutionPolicy Bypass -File $path `
            -Action disable `
            -GamePath $game `
            -ModDirectory $mod

          if (Test-Path -LiteralPath $markerPath) {
            throw "observation marker was not removed"
          }
          Write-Output "RUNTIME_OBSERVATION_POWERSHELL_OK marker=true status=true disable=true"
