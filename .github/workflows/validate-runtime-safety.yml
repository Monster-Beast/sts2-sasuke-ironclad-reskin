name: Validate runtime safety
on: [push, pull_request]

jobs:
  validate-runtime-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_runtime_safety_contract.py
      - run: python -m compileall -q tools
